version: 2.1

# CI / release pipeline for the Gridcoin block explorer. Mirrors the
# layout of `stamp.gridcoin.club/.circleci/config.yml` so the same
# operator habits apply across the gridcoin.club hub:
#
#   * `ci` workflow runs on every commit. Per-package lint / typecheck /
#     unit tests gated by Nx affected detection so untouched packages
#     skip — keeps PR CI green-time tight even though the monorepo
#     ships two non-trivial Node apps.
#   * After CI green on master, `*-release` jobs invoke
#     `semantic-release-monorepo` per package; conventional commits
#     decide whether a tagged release happens.
#   * Each tag (`grc-explorer-v*`, `grc-explorer-frontend-v*`) triggers
#     its own deploy workflow that builds the package's `Dockerfile.prod`
#     and pushes to `ghcr.io/gridcat/<package>:<version>` + `:latest`.
#
# Secrets the CircleCI project must have set:
#   - `CR_PAT` — GitHub PAT with `write:packages` for ghcr pushes
#   - the GitHub deploy key SSH config from CircleCI's "User key" panel
#     so semantic-release can push tags + commits back to master

defaults: &defaults
  working_directory: ~/app
  docker:
    - image: cimg/node:22.16

jobs:
  install-and-detect:
    <<: *defaults
    environment:
      PIPELINE_BASE_REVISION: << pipeline.git.base_revision >>
    steps:
      - checkout
      - run:
          name: Fetch full history and tags for Nx affected comparison
          command: |
            # Unshallow so `git describe` can walk back to release tags.
            # Falls back to a plain fetch if the clone is already complete.
            git fetch --tags --unshallow origin master:refs/remotes/origin/master 2>/dev/null || \
              git fetch --tags origin master:refs/remotes/origin/master
      - restore_cache:
          keys:
            - v1-root-deps-{{ checksum "package-lock.json" }}
      - restore_cache:
          keys:
            - v1-explorer-deps-{{ checksum "packages/grc-explorer/package-lock.json" }}
      - restore_cache:
          keys:
            - v1-frontend-deps-{{ checksum "packages/grc-explorer-frontend/package-lock.json" }}
      - run:
          name: Install root dependencies
          command: |
            HASH=$(sha256sum package-lock.json | awk '{print $1}')
            if [ -f node_modules/.lockfile-hash ] && [ "$(cat node_modules/.lockfile-hash)" = "$HASH" ]; then
              echo "Root deps cache hit — skipping install"
            else
              npm ci
              echo "$HASH" > node_modules/.lockfile-hash
            fi
      - run:
          name: Install grc-explorer dependencies
          command: |
            cd ~/app/packages/grc-explorer
            HASH=$(sha256sum package-lock.json | awk '{print $1}')
            if [ -f node_modules/.lockfile-hash ] && [ "$(cat node_modules/.lockfile-hash)" = "$HASH" ]; then
              echo "grc-explorer deps cache hit — skipping install"
            else
              npm ci
              echo "$HASH" > node_modules/.lockfile-hash
            fi
      - run:
          name: Install grc-explorer-frontend dependencies
          command: |
            cd ~/app/packages/grc-explorer-frontend
            HASH=$(sha256sum package-lock.json | awk '{print $1}')
            if [ -f node_modules/.lockfile-hash ] && [ "$(cat node_modules/.lockfile-hash)" = "$HASH" ]; then
              echo "grc-explorer-frontend deps cache hit — skipping install"
            else
              npm ci
              echo "$HASH" > node_modules/.lockfile-hash
            fi
      - save_cache:
          key: v1-root-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/app/node_modules
      - save_cache:
          key: v1-explorer-deps-{{ checksum "packages/grc-explorer/package-lock.json" }}
          paths:
            - ~/app/packages/grc-explorer/node_modules
      - save_cache:
          key: v1-frontend-deps-{{ checksum "packages/grc-explorer-frontend/package-lock.json" }}
          paths:
            - ~/app/packages/grc-explorer-frontend/node_modules
      - run:
          name: Audit production dependencies for known vulnerabilities
          command: |
            # Hard-fail at high+ severity on production deps. Dev deps
            # (test/lint toolchain) are excluded — they don't ship and
            # noise from them would dull the signal here.
            set +e
            FAIL=0
            for dir in ~/app ~/app/packages/grc-explorer ~/app/packages/grc-explorer-frontend; do
              echo "::: Auditing $dir"
              ( cd "$dir" && npm audit --audit-level=high --omit=dev ) || FAIL=1
            done
            exit $FAIL
      - run:
          name: Detect affected projects
          command: |
            mkdir -p ~/app/.affected

            # Compare against the previous CI run on this branch.
            # Release jobs on master always run (semantic-release decides
            # whether to publish); this only gates check/test jobs.
            check_affected() {
              local project="$1"
              local base

              if [ -n "$PIPELINE_BASE_REVISION" ]; then
                base="$PIPELINE_BASE_REVISION"
              else
                base="origin/master"
              fi

              echo "Checking $project against base: $base"
              local affected
              affected=$(npx nx show projects --affected --base="$base" --head=HEAD 2>/dev/null) || {
                echo "  WARNING: affected detection failed (base=$base), marking $project as affected"
                echo "true" > ~/app/.affected/"$project"
                return
              }
              echo "  affected projects in range: $affected"
              if echo "$affected" | grep -qw "$project"; then
                echo "true" > ~/app/.affected/"$project"
              else
                echo "false" > ~/app/.affected/"$project"
              fi
              echo "  $project affected: $(cat ~/app/.affected/"$project")"
            }

            check_affected grc-explorer
            check_affected grc-explorer-frontend
      - persist_to_workspace:
          root: ~/app
          paths: .

  grc-explorer-checks:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/app
      - run:
          name: Check if grc-explorer is affected
          command: |
            FLAG=$(cat ~/app/.affected/grc-explorer 2>/dev/null || echo "false")
            if [ "$FLAG" != "true" ]; then
              echo "grc-explorer not affected, skipping"
              circleci-agent step halt
            fi
      - run:
          name: Run lint
          command: cd ~/app/packages/grc-explorer && npm run test:lint
      - run:
          name: Run typecheck
          command: cd ~/app/packages/grc-explorer && npm run typecheck
      - run:
          name: Run unit tests
          command: cd ~/app/packages/grc-explorer && npm run test:unit

  grc-explorer-frontend-checks:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/app
      - run:
          name: Check if grc-explorer-frontend is affected
          command: |
            FLAG=$(cat ~/app/.affected/grc-explorer-frontend 2>/dev/null || echo "false")
            if [ "$FLAG" != "true" ]; then
              echo "grc-explorer-frontend not affected, skipping"
              circleci-agent step halt
            fi
      - run:
          name: Run lint
          command: cd ~/app/packages/grc-explorer-frontend && npm run test:lint
      - run:
          name: Run typecheck
          command: cd ~/app/packages/grc-explorer-frontend && npm run typecheck
      - run:
          name: Run unit tests
          command: cd ~/app/packages/grc-explorer-frontend && npm run test:unit

  grc-explorer-release:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/app
      - run:
          name: Trust SSH key
          command: mkdir -p ~/.ssh/ && touch ~/.ssh/known_hosts && ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Sync with master
          command: |
            cd ~/app
            git fetch origin master
            git reset --hard origin/master
      - run:
          name: Semantic release
          command: cd ~/app/packages/grc-explorer && npm run semantic-release

  grc-explorer-frontend-release:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/app
      - run:
          name: Trust SSH key
          command: mkdir -p ~/.ssh/ && touch ~/.ssh/known_hosts && ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Semantic release
          command: cd ~/app/packages/grc-explorer-frontend && npm run semantic-release

  grc-explorer_build_image:
    <<: *defaults
    docker:
      - image: docker:git
    steps:
      - checkout
      - run:
          name: Get the recent changes
          command: git pull origin master
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Install dependencies
          command: apk add --no-cache jq
      - restore_cache:
          keys:
            - v1-{{ .Branch }}
          paths:
            - /caches/grc-explorer.tar
      - run:
          name: Load Docker image layer cache
          command: |
            set +o pipefail
            docker load -i /caches/grc-explorer.tar | true
      - run:
          name: Build application Docker image
          command: |
            cd ~/app/packages/grc-explorer && docker build --cache-from=app -t app -f Dockerfile.prod .
      - run:
          name: Save Docker image layer cache
          command: |
            mkdir -p /caches
            cd ~/app/packages/grc-explorer && docker save -o /caches/grc-explorer.tar app
      - deploy:
          name: Push application Docker image
          command: |
            cd ~/app/packages/grc-explorer
            docker login ghcr.io -u gridcat -p${CR_PAT}
            docker tag app "ghcr.io/gridcat/$(jq -r '.name' package.json):$(jq -r '.version' package.json)"
            docker push "ghcr.io/gridcat/$(jq -r '.name' package.json):$(jq -r '.version' package.json)"
            docker tag app "ghcr.io/gridcat/$(jq -r '.name' package.json):latest"
            docker push "ghcr.io/gridcat/$(jq -r '.name' package.json):latest"

  grc-explorer-frontend_build_image:
    <<: *defaults
    docker:
      - image: docker:git
    steps:
      - checkout
      - run:
          name: Get the recent changes
          command: git pull origin master
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Install dependencies
          command: apk add --no-cache jq
      - restore_cache:
          keys:
            - v1-{{ .Branch }}
          paths:
            - /caches/grc-explorer-frontend.tar
      - run:
          name: Load Docker image layer cache
          command: |
            set +o pipefail
            docker load -i /caches/grc-explorer-frontend.tar | true
      - run:
          name: Build application Docker image
          command: |
            cd ~/app/packages/grc-explorer-frontend && docker build --cache-from=app -t app -f Dockerfile.prod .
      - run:
          name: Save Docker image layer cache
          command: |
            mkdir -p /caches
            cd ~/app/packages/grc-explorer-frontend && docker save -o /caches/grc-explorer-frontend.tar app
      - deploy:
          name: Push application Docker image
          command: |
            cd ~/app/packages/grc-explorer-frontend
            docker login ghcr.io -u gridcat -p${CR_PAT}
            docker tag app "ghcr.io/gridcat/$(jq -r '.name' package.json):$(jq -r '.version' package.json)"
            docker push "ghcr.io/gridcat/$(jq -r '.name' package.json):$(jq -r '.version' package.json)"
            docker tag app "ghcr.io/gridcat/$(jq -r '.name' package.json):latest"
            docker push "ghcr.io/gridcat/$(jq -r '.name' package.json):latest"

  # Testnet sibling of grc-explorer-frontend_build_image. Same Dockerfile,
  # same source, but built with NETWORK=testnet so the Dockerfile
  # overlays .env.testnet onto .env.production.local before `next build`
  # — every NEXT_PUBLIC_* in the client bundle gets baked to its testnet
  # value. Pushed under :{version}-testnet and :latest-testnet so prod
  # compose can pin the testnet stack to a stable testnet build.
  grc-explorer-frontend_build_image-testnet:
    <<: *defaults
    docker:
      - image: docker:git
    steps:
      - checkout
      - run:
          name: Get the recent changes
          command: git pull origin master
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Install dependencies
          command: apk add --no-cache jq
      - restore_cache:
          keys:
            - v1-testnet-{{ .Branch }}
          paths:
            - /caches/grc-explorer-frontend-testnet.tar
      - run:
          name: Load Docker image layer cache
          command: |
            set +o pipefail
            docker load -i /caches/grc-explorer-frontend-testnet.tar | true
      - run:
          name: Build application Docker image (testnet)
          command: |
            cd ~/app/packages/grc-explorer-frontend && docker build --cache-from=app-testnet --build-arg NETWORK=testnet -t app-testnet -f Dockerfile.prod .
      - run:
          name: Save Docker image layer cache
          command: |
            mkdir -p /caches
            cd ~/app/packages/grc-explorer-frontend && docker save -o /caches/grc-explorer-frontend-testnet.tar app-testnet
      - deploy:
          name: Push testnet application Docker image
          command: |
            cd ~/app/packages/grc-explorer-frontend
            docker login ghcr.io -u gridcat -p${CR_PAT}
            docker tag app-testnet "ghcr.io/gridcat/$(jq -r '.name' package.json):$(jq -r '.version' package.json)-testnet"
            docker push "ghcr.io/gridcat/$(jq -r '.name' package.json):$(jq -r '.version' package.json)-testnet"
            docker tag app-testnet "ghcr.io/gridcat/$(jq -r '.name' package.json):latest-testnet"
            docker push "ghcr.io/gridcat/$(jq -r '.name' package.json):latest-testnet"

workflows:
  ci:
    jobs:
      - install-and-detect:
          filters:
            tags:
              ignore: /.*/

      - grc-explorer-checks:
          requires:
            - install-and-detect

      - grc-explorer-frontend-checks:
          requires:
            - install-and-detect

      - grc-explorer-frontend-release:
          context: semantic-release
          requires:
            - grc-explorer-frontend-checks
          filters:
            branches:
              only: master

      - grc-explorer-release:
          context: semantic-release
          requires:
            - grc-explorer-checks
            - grc-explorer-frontend-release
          filters:
            branches:
              only: master

  grc-explorer_deploy-tag:
    jobs:
      - grc-explorer_build_image:
          context: git-container-registry
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^grc-explorer-v.*/

  grc-explorer-frontend_deploy-tag:
    jobs:
      - grc-explorer-frontend_build_image:
          context: git-container-registry
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^grc-explorer-frontend-v.*/
      # Testnet image build disabled — testnet-explorer.gridcoin.club is
      # not planned for deployment. The `grc-explorer-frontend_build_image-testnet`
      # job definition above is kept in place so reviving testnet is a
      # one-line uncomment here, but it doesn't run on tag pushes today.
      # - grc-explorer-frontend_build_image-testnet:
      #     context: git-container-registry
      #     filters:
      #       branches:
      #         ignore: /.*/
      #       tags:
      #         only: /^grc-explorer-frontend-v.*/
